<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <script>
    // The FRED project page moved from /fred/ to /FRED/; keep old links working.
    var path = window.location.pathname;
    if (/^\/fred(\/|$)/.test(path)) {
      window.location.replace('/FRED' + path.slice('/fred'.length) + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Page not found. <a href="/">Go to the homepage</a>.</p>
</body>
</html>
